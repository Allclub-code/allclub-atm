<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Club Community Bank</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

h1,h2,h3{
margin-bottom:15px;
}

input,select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
border:none;
border-radius:8px;
}

button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
margin:4px;
font-weight:bold;
}

.primary{
background:#3b82f6;
color:white;
}

.success{
background:#22c55e;
color:white;
}

.danger{
background:#ef4444;
color:white;
}

.warning{
background:#f59e0b;
color:black;
}

.secondary{
background:#6b7280;
color:white;
}

.hidden{
display:none;
}

.balanceBox{
font-size:28px;
font-weight:bold;
color:#22c55e;
margin:15px 0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.history{
background:#111827;
padding:10px;
border-radius:10px;
max-height:250px;
overflow-y:auto;
}

.history div{
padding:6px;
border-bottom:1px solid #374151;
}

.memberBox{
background:#111827;
padding:10px;
margin-top:10px;
border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🏦 All Club Community Bank</h1>

</div>

<!-- LOGIN SCREEN -->

<div id="loginScreen" class="card">

<h2>Member Login</h2>

<input
id="accountNumber"
placeholder="Account Number">

<div class="grid">

<button onclick="addNumber(1)">1</button>
<button onclick="addNumber(2)">2</button>
<button onclick="addNumber(3)">3</button>

<button onclick="addNumber(4)">4</button>
<button onclick="addNumber(5)">5</button>
<button onclick="addNumber(6)">6</button>

<button onclick="addNumber(7)">7</button>
<button onclick="addNumber(8)">8</button>
<button onclick="addNumber(9)">9</button>

<button onclick="clearNumber()">C</button>
<button onclick="addNumber(0)">0</button>

</div>

<input
id="pin"
type="password"
placeholder="PIN">

<button
class="primary"
onclick="memberLogin()">
Login
</button>

<button
class="warning"
onclick="showAdminLogin()">
Admin Login
</button>

<p id="loginMessage"></p>

</div>

<!-- ADMIN LOGIN -->

<div
id="adminLoginScreen"
class="card hidden">

<h2>Admin Login</h2>

<input
id="adminPin"
type="password"
placeholder="Admin PIN">

<button
class="warning"
onclick="adminLogin()">
Enter
</button>

<button
class="secondary"
onclick="backToHome()">
Back
</button>

<p id="adminMessage"></p>

</div>

<!-- ATM SCREEN -->

<div
id="atmScreen"
class="card hidden">

<h2 id="memberName">
Member
</h2>

<div class="balanceBox">

Balance:
$<span id="balance">0</span>

</div>

<div class="grid">

<button
class="success"
onclick="deposit(5)">
Deposit $5
</button>

<button
class="success"
onclick="deposit(10)">
Deposit $10
</button>

<button
class="success"
onclick="deposit(20)">
Deposit $20
</button>

<button
class="success"
onclick="deposit(50)">
Deposit $50
</button>

<button
class="danger"
onclick="withdraw(5)">
Withdraw $5
</button>

<button
class="danger"
onclick="withdraw(10)">
Withdraw $10
</button>

<button
class="danger"
onclick="withdraw(20)">
Withdraw $20
</button>

<button
class="danger"
onclick="withdraw(50)">
Withdraw $50
</button>

</div>

<h3>Transfer Money</h3>

<input
id="transferAccount"
placeholder="Send To Account">

<input
id="transferAmount"
type="number"
placeholder="Amount">

<button
class="primary"
onclick="transferMoney()">

Transfer

</button>

<h3>Transaction History</h3>

<div
id="history"
class="history">
</div>

<br>
<button
class="primary"
onclick="printReceipt()">

Print Receipt

</button>

<button
class="warning"
onclick="changePin()">

Change PIN

</button>
<button
class="secondary"
onclick="logout()">

Logout

</button>

</div>

<!-- ADMIN SCREEN -->

<div
id="adminScreen"
class="card hidden">

<h2>Admin Dashboard</h2>

<h3>Create Member</h3>

<input
id="newName"
placeholder="Member Name">

<input
id="newAccount"
placeholder="Account Number">

<input
id="newPin"
placeholder="PIN">

<input
id="newBalance"
type="number"
placeholder="Starting Balance">

<button
class="success"
onclick="createAccount()">

Create Account

</button>

<hr><br>

<h3>Bank Statistics</h3>

<div id="stats"></div>

<br>
<button
class="primary"
onclick="searchMember()">

Search Member

</button>

<button
class="warning"
onclick="bankReport()">

Bank Report

</button>
<h3>Store Purchase</h3>

<input
id="storeAccount"
placeholder="Account Number">

<input
id="storeAmount"
type="number"
placeholder="Purchase Amount">

<input
id="storeName"
placeholder="Store Name">

<button
class="danger"
onclick="chargeAccount()">

Charge Account

</button>

<br><br>

<h3>All Members</h3>
<div id="memberList"></div>

<br>

<button
class="secondary"
onclick="adminLogout()">

Logout

</button>

</div>

<script>

const ADMIN_PIN = "9999";

let currentUser = null;

let failedAttempts = {};
let bankData =
JSON.parse(
localStorage.getItem("allClubBank")
) || {

accounts:{

"1001":{
name:"Demo Member",
pin:"1234",
balance:100,
history:[]
},

"1002":{
name:"Club President",
pin:"5678",
balance:250,
history:[]
}

}

};

saveData();

function saveData(){

localStorage.setItem(
"allClubBank",
JSON.stringify(bankData)
);

}

function backToHome(){

document
.getElementById("adminLoginScreen")
.classList.add("hidden");

document
.getElementById("loginScreen")
.classList.remove("hidden");

}

function showAdminLogin(){

document
.getElementById("loginScreen")
.classList.add("hidden");

document
.getElementById("adminLoginScreen")
.classList.remove("hidden");

}

function adminLogin(){

let pin =
document
.getElementById("adminPin")
.value;

if(pin === ADMIN_PIN){

document
.getElementById("adminLoginScreen")
.classList.add("hidden");

document
.getElementById("adminScreen")
.classList.remove("hidden");

loadMembers();

}else{

document
.getElementById("adminMessage")
.innerText =
"Wrong Admin PIN";

}

}

function adminLogout(){

document
.getElementById("adminScreen")
.classList.add("hidden");

document
.getElementById("loginScreen")
.classList.remove("hidden");

}

function memberLogin(){

let account =
document.getElementById("accountNumber").value;

let pin =
document.getElementById("pin").value;

if(!failedAttempts[account]){
failedAttempts[account]=0;
}

let member =
bankData.accounts[account];

if(!member){
alert("Account Not Found");
return;
}

if(failedAttempts[account] >= 3){
alert("Account Locked");
return;
}

if(member.pin !== pin){

failedAttempts[account]++;

alert(
"Wrong PIN (" +
failedAttempts[account] +
"/3)"
);

return;
}

failedAttempts[account]=0;

currentUser = account;

document
.getElementById("loginScreen")
.classList.add("hidden");

document
.getElementById("atmScreen")
.classList.remove("hidden");

updateScreen();

}
let account =
document
.getElementById("accountNumber")
.value;

let pin =
document
.getElementById("pin")
.value;

let member =
bankData.accounts[account];

if(!member){

document
.getElementById("loginMessage")
.innerText =
"Account Not Found";

return;

}

if(member.pin !== pin){

document
.getElementById("loginMessage")
.innerText =
"Wrong PIN";

return;

}

currentUser = account;

document
.getElementById("loginScreen")
.classList.add("hidden");

document
.getElementById("atmScreen")
.classList.remove("hidden");

updateScreen();

}

function logout(){

currentUser = null;

document
.getElementById("atmScreen")
.classList.add("hidden");

document
.getElementById("loginScreen")
.classList.remove("hidden");

}

function updateScreen(){

let member =
bankData.accounts[currentUser];

document
.getElementById("memberName")
.innerText =
member.name;

document
.getElementById("balance")
.innerText =
member.balance.toFixed(2);

loadHistory();

saveData();

}

function addHistory(
account,
text
){

let date =
new Date()
.toLocaleString();

bankData
.accounts[account]
.history
.unshift(
date + " - " + text
);

saveData();

}

function deposit(amount){

let member =
bankData.accounts[currentUser];

member.balance += amount;

addHistory(
currentUser,
"Deposit $" + amount
);

updateScreen();

}

function withdraw(amount){

let member =
bankData.accounts[currentUser];

if(
member.balance < amount
){

alert(
"Insufficient Funds"
);

return;

}

member.balance -= amount;

addHistory(
currentUser,
"Withdrawal $" + amount
);

updateScreen();

}

function transferMoney(){

let target =
document
.getElementById(
"transferAccount"
).value;

let amount =
Number(
document
.getElementById(
"transferAmount"
).value
);

if(
!bankData.accounts[target]
){

alert(
"Target Account Not Found"
);

return;

}

if(amount <= 0){

return;

}

if(
bankData
.accounts[currentUser]
.balance < amount
){

alert(
"Insufficient Funds"
);

return;

}

bankData
.accounts[currentUser]
.balance -= amount;

bankData
.accounts[target]
.balance += amount;

addHistory(
currentUser,
"Transfer $" +
amount +
" to " +
target
);

addHistory(
target,
"Received $" +
amount +
" from " +
currentUser
);

updateScreen();

}

function loadHistory(){

let box =
document
.getElementById(
"history"
);

box.innerHTML = "";

let history =
bankData
.accounts[currentUser]
.history;

history.forEach(item=>{

let row =
document
.createElement("div");

row.innerText = item;

box.appendChild(row);

});

}

function createAccount(){

let name =
document
.getElementById(
"newName"
).value;

let account =
document
.getElementById(
"newAccount"
).value;

let pin =
document
.getElementById(
"newPin"
).value;

let balance =
Number(
document
.getElementById(
"newBalance"
).value
);

if(
!name ||
!account ||
!pin
){

return;

}

bankData.accounts[account] = {

name:name,
pin:pin,
balance:balance,
history:[
"Account Created"
]

};

saveData();

loadMembers();

}

function loadMembers(){

let memberList =
document
.getElementById(
"memberList"
);

memberList.innerHTML = "";

let totalMoney = 0;
let totalAccounts = 0;

for(

let account
in
bankData.accounts

){

let member =
bankData
.accounts[account];

totalMoney +=
member.balance;

totalAccounts++;

let div =
document
.createElement("div");

div.className =
"memberBox";

div.innerHTML =

"<b>" +
member.name +
"</b><br>" +

"Acct: " +
account +
"<br>" +

"Balance: $" +
member.balance +
"<br><br>" +

"<button onclick='deleteAccount(\"" +
account +
"\")'>Delete</button>";

memberList
.appendChild(div);

}

document
.getElementById(
"stats"
).innerHTML =

"Members: " +
totalAccounts +

"<br><br>" +

"Total Bank Balance: $" +
totalMoney.toFixed(2);

}

function deleteAccount(
account
){

if(
confirm(
"Delete account?"
)
){

delete
bankData.accounts[
account
];

saveData();

loadMembers();

}

}

function generateCard(){

let account =
prompt("Account Number");

if(!bankData.accounts[account]){
alert("Member Not Found");
return;
}

let member =
bankData.accounts[account];

alert(

"ALL CLUB BANK CARD\n\n" +

member.name +

"\nAccount: " +

account +

"\nPIN: " +

member.pin

);

}
function addNumber(num){

document
.getElementById("accountNumber")
.value += num;

}

function clearNumber(){

document
.getElementById("accountNumber")
.value = "";

}
function chargeAccount(){

let account =
document.getElementById(
"storeAccount"
).value;

let amount =
Number(
document.getElementById(
"storeAmount"
).value
);

let store =
document.getElementById(
"storeName"
).value;

if(
!bankData.accounts[account]
){

alert("Account Not Found");
return;

}

if(
bankData.accounts[account]
.balance < amount
){

alert("Insufficient Funds");
return;

}

bankData.accounts[account]
.balance -= amount;

addHistory(
account,
"Purchase $" +
amount +
" at " +
store
);

saveData();

alert(
"Charge Complete"
);

}
</script>

</body>
</html>
