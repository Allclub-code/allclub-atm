<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Club Credit Union V3</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:20px;
min-height:100vh;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

.hidden{
display:none;
}

input{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
border:none;
border-radius:8px;
}

button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
margin:4px;
font-weight:bold;
}

.primary{
background:#3b82f6;
color:white;
}

.success{
background:#22c55e;
color:white;
}

.danger{
background:#ef4444;
color:white;
}

.warning{
background:#f59e0b;
color:black;
}

.gray{
background:#64748b;
color:white;
}

.balance{
font-size:36px;
color:#22c55e;
margin:20px 0;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
}

.history{
background:#111827;
padding:10px;
border-radius:10px;
max-height:250px;
overflow-y:auto;
}

.memberCard{
background:#111827;
padding:10px;
border-radius:10px;
margin-top:10px;
}

.logo{
font-size:40px;
text-align:center;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
🏦
</div>

<h1>All Club Credit Union</h1>

<p>
Community Banking System V3
</p>

</div>

<!-- MEMBER LOGIN -->

<div
id="loginScreen"
class="card">

<h2>Member Login</h2>

<input
id="accountInput"
placeholder="Account Number">

<div class="grid">

<button onclick="addNumber(1)">1</button>
<button onclick="addNumber(2)">2</button>
<button onclick="addNumber(3)">3</button>

<button onclick="addNumber(4)">4</button>
<button onclick="addNumber(5)">5</button>
<button onclick="addNumber(6)">6</button>

<button onclick="addNumber(7)">7</button>
<button onclick="addNumber(8)">8</button>
<button onclick="addNumber(9)">9</button>

<button onclick="clearNumber()">C</button>
<button onclick="addNumber(0)">0</button>

</div>
<input
id="pinInput"
type="password"
placeholder="PIN">

<button
class="primary"
onclick="memberLogin()">

Login

</button>

<button
class="warning"
onclick="showAdminLogin()">
Admin
</button>

<button
class="success"
onclick="showStoreLogin()">
Store
</button>

<p id="loginMsg"></p>

</div>

<!-- ADMIN LOGIN -->

<div
id="adminLogin"
class="card hidden">

<h2>Admin Login</h2>

<input
id="adminPinInput"
type="password"
placeholder="Admin PIN">

<button
class="warning"
onclick="adminLogin()">

Enter

</button>

<button
class="gray"
onclick="goHome()">

Back

</button>

</div>
<div
id="storeLogin"
class="card hidden">

<h2>Store Login</h2>

<input
id="storePin"
type="password"
placeholder="Store PIN">

<button
class="success"
onclick="storeLogin()">

Login

</button>

<button
class="gray"
onclick="goHome()">

Back

</button>

</div>
<!-- MEMBER ATM -->

<div
id="atmScreen"
class="card hidden">

<h2 id="memberName">
Member
</h2>

<div class="balance">
<div>

Points:
<span id="points">
0
</span>

<div class="balance">

Checking:
$<span id="balance">0</span>

</div>

<div>

Savings:
$<span id="savingsBalance">0</span>

</div>

<div class="grid">

<button
class="success"
onclick="deposit(5)">
Deposit $5
</button>

<button
class="success"
onclick="deposit(10)">
Deposit $10
</button>

<button
class="success"
onclick="deposit(20)">
Deposit $20
</button>

<button
class="danger"
onclick="withdraw(5)">
Withdraw $5
</button>

<button
class="danger"
onclick="withdraw(10)">
Withdraw $10
</button>

<button
class="danger"
onclick="withdraw(20)">
Withdraw $20
</button>

</div>
<h3>Transfer Money</h3>

<input
id="transferAccount"
placeholder="Send To Account">

<input
id="transferAmount"
type="number"
placeholder="Amount">

<button
class="primary"
onclick="transferMoney()">

Transfer

</button>

<br><br>
  <h3>Savings</h3>

<button
class="success"
onclick="moveToSavings()">

Move $10 To Savings

</button>

<button
class="primary"
onclick="moveFromSavings()">

Move $10 To Checking

</button>

<br><br>
<h3>Transaction History</h3>

<div
id="history"
class="history">
</div>

<br>
<button
class="primary"
onclick="printReceipt()">

Receipt

</button>

<button
class="warning"
onclick="changePin()">

Change PIN

</button>

<br><br>
<button
class="gray"
onclick="logout()">

Logout

</button>

</div>
<div
id="storeScreen"
class="card hidden">

<h2>Store Terminal</h2>

<input
id="purchaseAccount"
placeholder="Account Number">
<select id="memberSelect">
</select>
<div
id="selectedMemberInfo"
class="memberCard">

Select a Member

</div>
<button
class="primary"
onclick="loadSelectedMember()">

Select Member

</button>
<input
id="purchaseAmount"
type="number"
placeholder="Purchase Amount">

<input
id="purchaseStore"
placeholder="Store Name">

<button
class="danger"
onclick="chargeAccount()">

Charge Account

</button>

<button
class="gray"
onclick="storeLogout()">

Logout

</button>

</div>
<!-- ADMIN DASHBOARD -->

<div
id="adminScreen"
class="card hidden">

<h2>Admin Dashboard</h2>

<h3>Create Member</h3>

<input
id="newName"
placeholder="Member Name">

<input
id="newAccount"
placeholder="Account Number">

<input
id="newPin"
placeholder="PIN">

<input
id="newBalance"
type="number"
placeholder="Starting Balance">

<button
class="success"
onclick="createAccount()">

Create Account

</button>

<hr>

<br>
<h3>Tools</h3>

<button
class="primary"
onclick="searchMember()">

Search Member

</button>

<button
class="warning"
onclick="bankReport()">

Bank Report

</button>

<br><br>
  <button
class="success"
onclick="showLeaderboard()">

Top Savers

</button>

<br><br>
<h3>Members</h3>

<div
id="memberList">
</div>

<br>

<button
class="gray"
onclick="adminLogout()">

Logout

</button>

</div>

<script>

const ADMIN_PIN = "9999";
const STORE_PIN = "5555";
let currentAccount = null;
let failedAttempts = {};
let bankData =
JSON.parse(
localStorage.getItem("allClubV3")
) || {

accounts:{

"1001":{
name:"Demo Member",
pin:"1234",
balance:100,
history:[]
},

"1002":{
name:"Club President",
pin:"5678",
balance:250,
history:[]
}

}

};

saveData();

function saveData(){

localStorage.setItem(
"allClubV3",
JSON.stringify(bankData)
);

}

function goHome(){

document
.getElementById("adminLogin")
.classList.add("hidden");

document
.getElementById("loginScreen")
.classList.remove("hidden");

}

function showAdminLogin(){

document
.getElementById("loginScreen")
.classList.add("hidden");

document
.getElementById("adminLogin")
.classList.remove("hidden");

}

function adminLogin(){

let pin =
document
.getElementById("adminPinInput")
.value;

if(pin !== ADMIN_PIN){

alert("Wrong PIN");
return;

}

document
.getElementById("adminLogin")
.classList.add("hidden");

document
.getElementById("adminScreen")
.classList.remove("hidden");

loadMembers();

}

function adminLogout(){

document
.getElementById("adminScreen")
.classList.add("hidden");

document
.getElementById("loginScreen")
.classList.remove("hidden");

}

function memberLogin(){

let account =
document
.getElementById("accountInput")
.value;

let pin =
document
.getElementById("pinInput")
.value;

let member =
bankData.accounts[account];
if(!failedAttempts[account]){
failedAttempts[account]=0;
}
if(!member){

alert("Account Not Found");
return;

}

if(member.pin !== pin){
if(
failedAttempts[account] >= 3
){

alert("Account Locked");
return;

}

if(member.pin !== pin){

failedAttempts[account]++;

alert(
"Wrong PIN (" +
failedAttempts[account] +
"/3)"
);

return;

}
alert("Wrong PIN");
return;

}
failedAttempts[account] = 0;
currentAccount = account;

document
.getElementById("loginScreen")
.classList.add("hidden");

document
.getElementById("atmScreen")
.classList.remove("hidden");

updateATM();

}

function logout(){

currentAccount = null;

document
.getElementById("atmScreen")
.classList.add("hidden");

document
.getElementById("loginScreen")
.classList.remove("hidden");

}

function deposit(amount){

let member =
bankData.accounts[currentAccount];

if(!member.checking){
member.checking = 0;
}

if(!member.points){
member.points = 0;
}

member.checking += amount;

member.points += amount;

addHistory(
currentAccount,
"Deposited $" + amount
);

saveData();

updateATM();

}
function withdraw(amount){

if(
bankData
.accounts[currentAccount]
.balance < amount
){

alert("Not Enough Money");
return;

}

bankData
.accounts[currentAccount]
.balance -= amount;

addHistory(
currentAccount,
"Withdrew $" +
amount
);

updateATM();

}

function loadHistory(){

let box =
document.getElementById(
"history"
);

box.innerHTML = "";

let history =
bankData
.accounts[currentAccount]
.history;

history.forEach(item=>{

let row =
document.createElement("div");

row.innerText = item;

box.appendChild(row);

});

}

function createAccount(){

let name =
document.getElementById(
"newName"
).value;

let account =
document.getElementById(
"newAccount"
).value;

let pin =
document.getElementById(
"newPin"
).value;

let balance =
Number(
document.getElementById(
"newBalance"
).value
);

if(
!name ||
!account ||
!pin
){

alert("Fill Out All Fields");
return;

}

bankData.accounts[account] = {

name:name,
pin:pin,
checking:balance,
savings:0,
points:0,
history:[
"Account Created"
]

};

saveData();

loadMembers();

alert("Account Created");

}

function loadMembers(){

let memberList =
document.getElementById(
"memberList"
);

memberList.innerHTML = "";

for(
let account
in
bankData.accounts
){

let member =
bankData.accounts[account];

let card =
document.createElement("div");

card.className =
"memberCard";

card.innerHTML =

"<b>" +
member.name +
"</b><br>" +

"Account: " +
account +
"<br>" +

"Balance: $" +
member.checking +
"<br><br>" +

"<button onclick='deleteMember(\"" +
account +
"\")'>Delete</button>";

memberList.appendChild(card);

}

}

function deleteMember(account){

if(
confirm(
"Delete Account?"
)
){

delete
bankData.accounts[
account
];

saveData();

loadMembers();

}

}
  function transferMoney(){

let target =
document.getElementById(
"transferAccount"
).value;

let amount =
Number(
document.getElementById(
"transferAmount"
).value
);

if(!bankData.accounts[target]){
alert("Account Not Found");
return;
}

if(amount <= 0){
return;
}

if(bankData.accounts[currentAccount]
.balance < amount){

alert("Not Enough Money");
return;

}

bankData.accounts[currentAccount]
.balance -= amount;

bankData.accounts[target]
.balance += amount;

addHistory(
currentAccount,
"Transferred $" +
amount +
" to " +
target
);

addHistory(
target,
"Received $" +
amount +
" from " +
currentAccount
);

saveData();

updateATM();

}

function printReceipt(){

let member =
bankData.accounts[currentAccount];

alert(

"ALL CLUB CREDIT UNION\n\n" +

member.name +

"\nBalance: $" +

member.checking.toFixed(2)
);

}

function changePin(){

let oldPin =
prompt("Current PIN");

if(
oldPin !==
bankData.accounts[currentAccount].pin
){

alert("Wrong PIN");
return;

}

let newPin =
prompt("New PIN");

if(!newPin){
return;
}

bankData.accounts[currentAccount].pin =
newPin;

saveData();

alert("PIN Changed");

}

function searchMember(){

let account =
prompt("Account Number");

if(
!bankData.accounts[account]
){

alert("Not Found");
return;

}

let member =
bankData.accounts[account];

alert(

"Name: " +
member.name +

"\nBalance: $" +
member.checking

);

}

function bankReport(){

let total = 0;

let count = 0;

for(
let acct
in
bankData.accounts
){

count++;

total +=
bankData.accounts[acct]
.balance;

}

alert(

"Accounts: " +
count +

"\n\nTotal Bank Money: $" +
total.toFixed(2)

);

}
  function showStoreLogin(){

document
.getElementById("loginScreen")
.classList.add("hidden");

document
.getElementById("storeLogin")
.classList.remove("hidden");

}

function storeLogin(){

let pin =
document
.getElementById("storePin")
.value;

if(pin !== STORE_PIN){

alert("Wrong Store PIN");
return;

}

document
.getElementById("storeLogin")
.classList.add("hidden");

document
.getElementById("storeScreen")
.classList.remove("hidden");

loadStoreMembers();

}


if(pin !== STORE_PIN){

alert("Wrong Store PIN");
return;

}

document
.getElementById("storeLogin")
.classList.add("hidden");

document
.getElementById("storeScreen")
.classList.remove("hidden");

}

function storeLogout(){

document
.getElementById("storeScreen")
.classList.add("hidden");

document
.getElementById("loginScreen")
.classList.remove("hidden");

}

function chargeAccount(){

let account =
document.getElementById(
"purchaseAccount"
).value;

let amount =
Number(
document.getElementById(
"purchaseAmount"
).value
);

let store =
document.getElementById(
"purchaseStore"
).value;

if(!bankData.accounts[account]){

alert("Account Not Found");
return;

}

if(
bankData.accounts[account].balance
< amount
){

alert("Not Enough Money");
return;

}

bankData.accounts[account].balance -= amount;

addHistory(
account,
"Purchase $" +
amount +
" at " +
store
);

saveData();

alert(
"Purchase Complete"
);

}
  function loadStoreMembers(){

let select =
document.getElementById(
"memberSelect"
);

select.innerHTML = "";

for(
let account
in
bankData.accounts
){

let option =
document.createElement(
"option"
);

option.value =
account;

option.text =

bankData.accounts[
account
].name +

" (" +

account +

")";

select.appendChild(
option
);

}

}

function loadSelectedMember(){

let account =
document.getElementById(
"memberSelect"
).value;

document
.getElementById(
"purchaseAccount"
)
.value = account;

let member =
bankData.accounts[account];

document
.getElementById(
"selectedMemberInfo"
)
.innerHTML =

"<h3>" +
member.name +
"</h3>" +

"Account: " +
account +

"<br><br>" +

"Balance: $" +
member.checking.toFixed(2);

}
let account =
document.getElementById(
"memberSelect"
).value;

document
.getElementById(
"purchaseAccount"
)
.value = account;

}
  function showLeaderboard(){

let members = [];

for(
let account
in
bankData.accounts
){

members.push({

name:
bankData.accounts[
account
].name,

balance:
bankData.accounts[
account
].balance

});

}

members.sort(
(a,b)=>
b.balance-a.balance
);

let text =
"TOP SAVERS\n\n";

members.forEach(
(member,index)=>{

text +=

(index+1) +

". " +

member.name +

" - $" +

member.checking +

"\n";

});

alert(text);

}
  function moveToSavings(){

let member =
bankData.accounts[currentAccount];

if(member.checking < 10){
alert("Not Enough Money");
return;
}

member.checking -= 10;

member.savings += 10;

addHistory(
currentAccount,
"Moved $10 To Savings"
);

saveData();

updateATM();

}

function moveFromSavings(){

let member =
bankData.accounts[currentAccount];

if(member.savings < 10){
alert("Not Enough Savings");
return;
}

member.savings -= 10;

member.checking += 10;

addHistory(
currentAccount,
"Moved $10 To Checking"
);

saveData();

updateATM();

}
  function addNumber(num){

document
.getElementById("accountInput")
.value += num;

}

function clearNumber(){

document
.getElementById("accountInput")
.value = "";

}
</script>

</body>
</html>
